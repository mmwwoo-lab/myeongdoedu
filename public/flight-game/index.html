<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>명도재 하늘 비행 | 초등용 힐링게임</title><style>*{box-sizing:border-box}body{margin:0;background:#d9f1ff;font-family:system-ui,'Noto Sans KR',sans-serif;color:#183d5e}main{position:relative;margin:auto;width:min(100%,600px);height:100dvh;overflow:hidden;background:linear-gradient(#79caff,#e9f9ff)}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 0}.stat{background:#fffdf0e8;border-radius:12px;padding:6px 9px;font-size:12px}.stat b{display:block;font-size:17px}.btn{border:0;border-radius:13px;background:#217cc7;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.hud .btn{margin-left:auto;background:#fff;color:#20527e}.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 15px);left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}.controls button{pointer-events:auto;border:1px solid #fff;background:#ffffffb9;color:#125b8d;font-size:24px;border-radius:18px;width:66px;height:58px;touch-action:none}.guide{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 79px);width:100%;text-align:center;font-size:12px}.overlay{position:absolute;inset:0;background:#14547dab;display:grid;place-items:center;padding:18px}.panel{background:#fff;border-radius:24px;padding:26px 18px;text-align:center;width:min(100%,420px);box-shadow:0 15px 40px #19527a55}.panel h1{font-size:clamp(23px,6vw,30px);margin:8px 0}.panel p{line-height:1.65}.panel .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.panel .actions button{flex:1;min-width:120px}.sub{background:#e7f2fa;color:#20527e}.hide{display:none!important}</style></head><body><main id="area"><canvas id="sky" aria-label="별을 모으는 비행 게임"></canvas><div class="hud"><div class="stat">⭐ 점수<b id="score">0</b></div><div class="stat">🏆 최고<b id="best">0</b></div><div class="stat">⏱ 남은 시간<b id="time">60</b></div><button class="btn hide" id="pause">일시정지</button></div><div class="guide">손가락 드래그 또는 ◀ ▶ 버튼으로 이동</div><div class="controls"><button id="left" aria-label="왼쪽 이동">◀</button><button id="right" aria-label="오른쪽 이동">▶</button></div><section class="overlay" id="overlay"><div class="panel"><div style="font-size:50px">✈️☁️</div><h1 id="title">명도재 하늘 비행</h1><p id="msg">푸른 하늘을 날며 별을 모으고 먹구름을 피해 보세요.<br>60초 동안 즐기는 초등용 힐링 비행!</p><p style="font-size:13px">⭐ +10점 · ☁️ -5점 · 충돌해도 계속 비행해요.</p><div class="actions"><button class="btn" id="play">비행 시작</button><button class="btn sub" id="reset">최고점수 지우기</button></div></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('sky'),ctx=canvas.getContext('2d'),area=$('area'),overlay=$('overlay');let W=360,H=700,plane=W/2,score=0,best=0,remaining=60,mode='intro',items=[],clouds=[],spark=[],last=0,spawn=0,frame=0,immune=0,drag=null,left=false,right=false;try{best=+localStorage.getItem('myeongdo_flight_best')||0}catch(e){}function hud(){$('score').textContent=score;$('best').textContent=best;$('time').textContent=Math.ceil(remaining)}function resize(){W=area.clientWidth;H=area.clientHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);plane=Math.max(32,Math.min(W-32,plane));clouds=Array.from({length:7},(_,i)=>({x:(i*97+33)%W,y:(i*131)%H,v:7+i*2}))}addEventListener('resize',resize);resize();hud();function start(){score=0;remaining=60;spawn=0;plane=W/2;items=[];spark=[];immune=0;mode='play';drag=null;overlay.classList.add('hide');$('pause').classList.remove('hide');$('pause').textContent='일시정지';hud()}function end(){mode='end';if(score>best){best=score;try{localStorage.setItem('myeongdo_flight_best',best)}catch(e){}}hud();$('title').textContent='비행 완료! 🎉';$('msg').textContent='이번 비행 '+score+'점 · 최고 '+best+'점! 다시 하늘로 떠나볼까요?';$('play').textContent='다시 비행하기';$('pause').classList.add('hide');overlay.classList.remove('hide');$('reset').classList.remove('hide')}function toggle(){if(mode==='play'){mode='pause';$('title').textContent='잠시 쉬어가기 ☁️';$('msg').textContent='계속하기를 누르면 남은 시간부터 이어집니다.';$('play').textContent='계속하기';$('reset').classList.add('hide');overlay.classList.remove('hide')}else if(mode==='pause'){mode='play';overlay.classList.add('hide');$('reset').classList.remove('hide')}}$('play').onclick=()=>mode==='pause'?toggle():start();$('pause').onclick=toggle;$('reset').onclick=()=>{best=0;try{localStorage.removeItem('myeongdo_flight_best')}catch(e){}hud()};for(const side of ['left','right']){let el=$(side);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);if(side==='left')left=true;else right=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>{if(side==='left')left=false;else right=false})}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true;if(e.key===' '&&(mode==='play'||mode==='pause'))toggle()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});canvas.addEventListener('pointerdown',e=>{if(mode!=='play')return;canvas.setPointerCapture(e.pointerId);drag=e.clientX-area.getBoundingClientRect().left});canvas.addEventListener('pointermove',e=>{if(mode==='play'&&drag!==null)drag=e.clientX-area.getBoundingClientRect().left});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);function cloud(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x-r*.5,y,r*.55,0,7);ctx.arc(x,y-r*.24,r*.7,0,7);ctx.arc(x+r*.55,y,r*.5,0,7);ctx.fill()}function star(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(frame*.015);ctx.beginPath();for(let k=0;k<10;k++){let a=-Math.PI/2+k*Math.PI/5,r=k%2?7:15;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fillStyle='#ffd23d';ctx.fill();ctx.strokeStyle='#fff5ad';ctx.lineWidth=2;ctx.stroke();ctx.restore()}function planeDraw(){ctx.save();ctx.translate(plane,H*.76);if(immune>0&&Math.floor(frame/6)%2)ctx.globalAlpha=.45;ctx.fillStyle='#1366bc';ctx.beginPath();ctx.moveTo(0,-29);ctx.lineTo(12,-3);ctx.lineTo(31,14);ctx.lineTo(29,22);ctx.lineTo(7,13);ctx.lineTo(7,26);ctx.lineTo(-7,26);ctx.lineTo(-7,13);ctx.lineTo(-29,22);ctx.lineTo(-31,14);ctx.lineTo(-12,-3);ctx.closePath();ctx.fill();ctx.fillStyle='#d8f8ff';ctx.beginPath();ctx.ellipse(0,-6,5,12,0,0,7);ctx.fill();ctx.restore()}function render(){ctx.clearRect(0,0,W,H);for(const c of clouds)cloud(c.x,c.y,29,'#ffffff77');for(const it of items)it.type==='star'?star(it.x,it.y):cloud(it.x,it.y,24,'#718eaa');for(const s of spark){ctx.globalAlpha=Math.max(0,s.life/.6);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,3,0,7);ctx.fill();ctx.globalAlpha=1}planeDraw()}function update(dt){frame++;for(const c of clouds){c.y+=c.v*dt;if(c.y>H+40)c.y=-50}if(mode!=='play')return;remaining-=dt;if(remaining<=0){remaining=0;end();return}spawn+=dt;if(spawn>.65){spawn=0;items.push({x:30+Math.random()*(Math.max(60,W)-60),y:-35,type:Math.random()<.72?'star':'cloud',v:115+Math.random()*75})}if(drag!==null)plane+=(drag-plane)*Math.min(1,dt*13);else plane+=((right?1:0)-(left?1:0))*280*dt;plane=Math.max(33,Math.min(W-33,plane));immune-=dt;for(let i=items.length-1;i>=0;i--){let it=items[i];it.y+=it.v*dt;if(Math.hypot(it.x-plane,it.y-H*.76)<29){if(it.type==='star'){score+=10;for(let k=0;k<10;k++)spark.push({x:it.x,y:it.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.6,color:'#ffcc20'})}else if(immune<=0){score=Math.max(0,score-5);immune=1.1}items.splice(i,1)}else if(it.y>H+30)items.splice(i,1)}for(let i=spark.length-1;i>=0;i--){let s=spark[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0)spark.splice(i,1)}hud()}function loop(t){if(!last)last=t;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>

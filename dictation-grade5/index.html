<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>명도재 5학년 받아쓰기 교실</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2ff;color:#26304c;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:linear-gradient(120deg,#4d60d1,#7194eb);color:white;text-align:center;padding:25px 14px}h1{font-size:clamp(23px,5vw,34px);margin:5px}main{max-width:670px;margin:15px auto;padding:0 13px}.box{background:white;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 4px 18px #273e8614}h2{font-size:21px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:white;border-radius:14px;text-align:center;padding:11px 3px;font-size:12px}.stat b{display:block;font-size:20px;color:#4757c8}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1;min-width:120px}button{background:#515bca;color:white;border:0;border-radius:12px;font:inherit;font-weight:700;padding:13px;cursor:pointer;min-height:46px}button.alt{background:#e8ebff;color:#3641a6}button:disabled{opacity:.5}textarea{width:100%;min-height:115px;padding:13px;border:2px solid #d8dcf5;border-radius:12px;font:18px/1.6 inherit;resize:vertical;margin:14px 0}textarea:focus-visible,button:focus-visible{outline:3px solid #edb94f}.bar{background:#e6e9fc;height:11px;border-radius:12px;overflow:hidden}.fill{height:100%;background:#67bca8;transition:width .2s}.feedback{padding:14px;border-radius:12px;background:#f1f2ff;margin-top:13px;line-height:1.7}.correct{background:#e8fbef}.wrong{background:#fff1e6}.hidden{display:none!important}.muted{font-size:13px;color:#59647c}.step{display:inline-block;background:#e4e8ff;border-radius:9px;padding:6px 11px;font-weight:700;color:#424caa}.sound{float:right;font-size:12px;padding:8px;min-height:35px}.review p{border-bottom:1px solid #eee;padding:10px 0}#confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10}.piece{position:absolute;top:-20px;width:10px;height:15px;animation:fall 1.5s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(650deg);opacity:0}}@media(prefers-reduced-motion:reduce){.piece{animation-duration:.3s}}</style></head><body><header><h1>✏️ 명도재 5학년 받아쓰기 교실</h1><div>초등 국어 · 3단계 × 10문제 = 총 30문제</div></header><main><div class="stats"><div class="stat"><b id="stageStat">1 / 3</b>학습 단계</div><div class="stat"><b id="countStat">1 / 30</b>전체 진행</div><div class="stat"><b id="scoreStat">0</b>누적 정답</div></div>
<section id="quiz" class="box"><button class="alt sound" id="toggle">🔔 효과음 켜짐</button><div class="step" id="stageName"></div><h2 id="prompt">음성을 듣고 문장을 적으세요.</h2><div class="bar"><div class="fill" id="bar"></div></div><p class="muted" id="questionNo"></p><div class="buttons"><button id="speak">🔊 문장 듣기</button><button class="alt" id="slow">🐢 천천히 듣기</button><button class="alt" id="showText">👁 문장 보기</button></div><p class="muted" id="voiceStatus" role="status" aria-live="polite">소리가 들리지 않으면 기기 음량을 확인하거나 문장 보기를 사용하세요.</p><label for="answer"><p><b>들은 문장을 입력하세요.</b></p></label><textarea id="answer" autocomplete="off" spellcheck="false" placeholder="여기에 받아쓰기 문장을 입력하세요."></textarea><div class="buttons"><button class="alt" id="hint">💡 힌트</button><button id="check">✅ 정답 확인</button></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="buttons" style="margin-top:12px"><button id="next" class="hidden">다음 문제 ➜</button></div></section>
<section id="stageResult" class="box hidden"><h2>🏅 <span id="stageDone"></span> 학습 완료!</h2><p id="stageScores"></p><div class="review" id="stageReview"></div><button id="advance">다음 단계 시작 ➜</button></section>
<section id="finalResult" class="box hidden"><h2>🎉 30문제 전체 학습 완료!</h2><p id="finalScores" style="font-size:22px;line-height:1.7"></p><p id="finalMessage"></p><div id="finalReview" class="review"></div><div class="buttons"><button id="retry">🔁 처음부터 다시 풀기</button></div></section>
<section class="box muted">문장 끝의 마침표는 생략해도 정답입니다. 맞춤법과 띄어쓰기는 정확히 입력하세요. 문제 읽기와 축하·오답 효과음은 기기의 음성·오디오 기능에 따라 다를 수 있습니다.</section></main><div id="confetti"></div>
<script>
const stages=[{"name":"1단계 · 기본 맞춤법","q":[["햇볕이 따뜻해서 산책하기 좋은 날입니다.","‘햇볕’의 받침을 확인하세요."],["책상 위에 연필과 공책이 놓여 있습니다.","‘책상 위’는 띄어 씁니다."],["바람이 불어 나뭇잎이 흔들렸습니다.","‘나뭇잎’에 사이시옷이 들어갑니다."],["우리 반 친구들은 서로 힘을 합쳤습니다.","‘우리 반’은 띄어 씁니다."],["나는 어려운 문제를 끝까지 해결했습니다.","‘끝까지’를 바르게 적으세요."],["비가 그치자 무지개가 나타났습니다.","‘그치자’의 표기를 살펴보세요."],["동생이 깨끗하게 손을 씻었습니다.","‘깨끗하게’를 정확히 적으세요."],["약속한 시간에 맞춰 도착했습니다.","‘맞춰’의 모음을 확인하세요."],["아름다운 꽃들이 마당에 피었습니다.","‘피었습니다’를 바르게 적으세요."],["친구에게 고맙다는 말을 전했습니다.","‘고맙다’의 활용을 확인하세요."]]},{"name":"2단계 · 띄어쓰기와 문장","q":[["우리는 아침 일찍 학교에 갔습니다.","‘아침 일찍’은 띄어 씁니다."],["할 수 있는 일부터 시작해 봅시다.","‘할 수 있는’의 띄어쓰기에 주의하세요."],["나는 숙제를 마친 뒤 책을 읽었습니다.","‘마친 뒤’는 띄어 씁니다."],["동생은 한 걸음씩 천천히 걸었습니다.","‘한 걸음씩’을 살펴보세요."],["이곳에서는 큰 소리로 떠들면 안 됩니다.","‘안 됩니다’는 띄어 씁니다."],["선생님께 질문한 뒤 스스로 답을 찾았습니다.","‘질문한 뒤’를 띄어 씁니다."],["어제보다 오늘 더 많이 웃었습니다.","‘어제보다’는 붙여 씁니다."],["날씨가 추우니 겉옷을 꼭 챙기세요.","‘겉옷’과 ‘챙기세요’를 살펴보세요."],["친구가 도와준 덕분에 일을 끝냈습니다.","‘덕분에’ 앞을 띄어 씁니다."],["하늘에 떠 있는 구름을 바라보았습니다.","‘떠 있는’을 띄어 씁니다."]]},{"name":"3단계 · 응용 받아쓰기","q":[["맛있는 음식을 나누어 먹으니 기뻤습니다.","‘나누어’와 ‘기뻤습니다’를 확인하세요."],["우산을 챙겼는데 갑자기 비가 멈췄습니다.","‘챙겼는데’의 받침을 살펴보세요."],["작은 실천이 모여 큰 변화를 만듭니다.","‘실천’과 ‘변화’를 바르게 적으세요."],["책을 읽을수록 새로운 생각이 떠오릅니다.","‘읽을수록’은 붙여 씁니다."],["모두가 함께 노력했기에 좋은 결과를 얻었습니다.","‘노력했기에’의 표기를 확인하세요."],["실수했더라도 다시 도전하는 용기가 필요합니다.","‘실수했더라도’를 정확히 적으세요."],["환경을 보호하려면 쓰레기를 줄여야 합니다.","‘줄여야’를 바르게 적으세요."],["낯선 길에서도 안내 표지판을 잘 살펴보았습니다.","‘낯선’의 받침에 주의하세요."],["상대방의 의견을 존중하며 이야기를 나누었습니다.","‘존중하며’를 바르게 적으세요."],["꾸준히 연습하면 어려운 일도 해낼 수 있습니다.","‘해낼 수’의 띄어쓰기에 주의하세요."]]}];const $=id=>document.getElementById(id);let stage=0,question=0,correct=0,done=false,sound=true,records=[];let audio;const total=30;
const item=()=>stages[stage].q[question];const normalize=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/[.!?。！？]+$/u,'').trim();
function speak(rate){
 const status=$('voiceStatus');
 const synth=window.speechSynthesis;
 if(!synth||typeof window.SpeechSynthesisUtterance!=='function'){
   status.textContent='이 기기에서는 음성 읽기를 지원하지 않습니다. 문장 보기로 학습할 수 있습니다.';return;
 }
 try{
   synth.cancel();
   const utterance=new window.SpeechSynthesisUtterance(item()[0]);
   utterance.lang='ko-KR';utterance.rate=rate;utterance.volume=1;
   const voices=synth.getVoices();
   const korean=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));
   if(korean)utterance.voice=korean;
   utterance.onerror=()=>{status.textContent='음성 재생이 중단되었습니다. 다시 듣거나 문장 보기를 눌러 주세요.'};
   utterance.onstart=()=>{status.textContent='🔊 문장을 읽고 있습니다.'};
   utterance.onend=()=>{status.textContent='재생 완료 · 다시 듣기를 누르면 반복됩니다.'};
   synth.speak(utterance);
   status.textContent='음성 재생을 요청했습니다. 소리가 들리지 않으면 기기 음량을 확인하세요.';
 }catch(e){status.textContent='음성을 재생할 수 없습니다. 문장 보기를 눌러 학습하세요.'}
}
function tone(ok){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio??=new C();audio.resume();const notes=ok?[660,880,1047]:[330,250];notes.forEach((freq,i)=>{const osc=audio.createOscillator(),g=audio.createGain(),start=audio.currentTime+i*.13;osc.type=ok?'sine':'triangle';osc.frequency.value=freq;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.12,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+.21);osc.connect(g).connect(audio.destination);osc.start(start);osc.stop(start+.22)})}catch(e){}}
function fireworks(){const layer=$('confetti');layer.replaceChildren();for(let i=0;i<52;i++){const p=document.createElement('span');p.className='piece';p.style.left=Math.random()*100+'%';p.style.background=['#ef657e','#ffd45c','#5dd5b6','#6b88f4','#a879e8'][i%5];p.style.setProperty('--dx',Math.round(Math.random()*180-90)+'px');p.style.animationDelay=Math.random()*.2+'s';layer.append(p)}setTimeout(()=>layer.replaceChildren(),1900)}
function display(){done=false;$('quiz').classList.remove('hidden');$('stageResult').classList.add('hidden');$('finalResult').classList.add('hidden');$('stageStat').textContent=(stage+1)+' / 3';$('countStat').textContent=(stage*10+question+1)+' / 30';$('scoreStat').textContent=correct;$('stageName').textContent=stages[stage].name;$('questionNo').textContent=(question+1)+' / 10번 문제';$('bar').style.width=((stage*10+question+1)/30*100)+'%';$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('hint').disabled=false;$('feedback').className='feedback hidden';$('feedback').textContent='';$('voiceStatus').textContent='🔊 문장 듣기를 누르세요. 소리가 들리지 않으면 문장 보기를 이용하세요.';$('next').classList.add('hidden');$('next').textContent=question===9?'단계 결과 보기 ➜':'다음 문제 ➜'}
function check(){if(done)return;const response=$('answer').value.trim();if(!response){$('feedback').className='feedback';$('feedback').textContent='먼저 들은 문장을 적어 보세요.';return}done=true;const [expected,explain]=item(),ok=normalize(response)===normalize(expected);if(ok)correct++;records.push({stage,number:question+1,expected,response,ok,explain});$('scoreStat').textContent=correct;tone(ok);if(ok)fireworks();$('feedback').className='feedback '+(ok?'correct':'wrong');$('feedback').textContent=(ok?'🎊 정답입니다!':'🔔 다시 살펴봐요.')+' 정답: '+expected+' · '+explain;$('answer').disabled=true;$('check').disabled=true;$('hint').disabled=true;$('next').classList.remove('hidden')}
function reviews(parent,arr){parent.replaceChildren();if(!arr.length){parent.textContent='🌟 모든 문제를 맞혔어요!';return}arr.forEach(r=>{const p=document.createElement('p');p.textContent=r.number+'번 · 내가 쓴 답: '+r.response+' / 정답: '+r.expected+' ('+r.explain+')';parent.append(p)})}
function endStage(){if(window.speechSynthesis)window.speechSynthesis.cancel();$('quiz').classList.add('hidden');$('stageResult').classList.remove('hidden');$('stageDone').textContent=stages[stage].name;const n=records.filter(r=>r.stage===stage&&r.ok).length;$('stageScores').textContent='10문제 중 '+n+'문제 정답 · 단계 점수 '+(n*10)+'점 / 100점 · 누적 '+correct+' / '+records.length+'문제';reviews($('stageReview'),records.filter(r=>r.stage===stage&&!r.ok));$('advance').textContent=stage===2?'🏆 최종 점수 확인하기':'다음 단계 시작 ➜'}
function endFinal(){$('stageResult').classList.add('hidden');$('finalResult').classList.remove('hidden');$('countStat').textContent='30 / 30';const score=Math.round(correct/30*100*10)/10;$('finalScores').innerHTML='<b>'+correct+' / 30문제 정답</b><br>최종 점수 <b>'+score+'점 / 100점</b>';$('finalMessage').textContent=correct===30?'🌟 만점입니다! 정말 훌륭해요!':correct>=24?'👏 아주 잘했어요! 틀린 문제를 복습해 보세요.':'🌱 한 단계씩 연습하면 더 잘할 수 있어요.';reviews($('finalReview'),records.filter(r=>!r.ok));window.scrollTo({top:0,behavior:'smooth'})}
$('showText').onclick=()=>{if(!done){$('feedback').className='feedback';$('feedback').textContent='👁 연습용 문장: '+item()[0]+' · 문장 보기를 사용해도 채점은 가능합니다.'}};$('speak').onclick=()=>speak(.9);$('slow').onclick=()=>speak(.67);$('hint').onclick=()=>{if(!done){$('feedback').className='feedback';$('feedback').textContent='💡 '+item()[1]}};$('check').onclick=check;$('next').onclick=()=>{if(question<9){question++;display()}else endStage()};$('advance').onclick=()=>{if(stage===2)endFinal();else{stage++;question=0;display()}};$('retry').onclick=()=>{stage=0;question=0;correct=0;records=[];display()};$('toggle').onclick=()=>{sound=!sound;$('toggle').textContent=sound?'🔔 효과음 켜짐':'🔕 효과음 꺼짐'};display();
</script></body></html>

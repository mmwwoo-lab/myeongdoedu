<!doctype html><html lang="ko"><meta charset="utf-8"><title>화면 크기별 호환성 검사</title><style>body{font:14px system-ui;margin:12px;background:#eee}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}button{padding:9px}iframe{display:block;border:1px solid #555;background:white;max-width:none}pre{font-size:12px;max-width:900px;max-height:80px;overflow:auto;white-space:pre-wrap}h1{font-size:20px}</style><h1>스마트폰과 PC 화면 검사</h1><nav><button data-size="320,568">작은 폰 320×568</button><button data-size="375,667">일반 폰 375×667</button><button data-size="390,844">큰 폰 390×844</button><button data-size="844,390">가로 폰 844×390</button><button data-size="1366,768">PC 1366×768</button></nav><pre id="metrics">검사 준비</pre><iframe id="preview" title="게임 크기별 미리보기" src="/" width="320" height="568"></iframe><script>
const frame=document.getElementById('preview'),output=document.getElementById('metrics');
function measure(){const w=frame.contentWindow,d=frame.contentDocument,r=s=>d.querySelector(s).getBoundingClientRect();if(!d.querySelector('#console'))return;const board=r('#board'),pad=r('.dpad'),system=r('.system-controls'),action=r('.action-controls'),pieces=r('.pieces-row'),mission=r('.mission-card');const hit=(a,b)=>a.left<b.right-1&&a.right>b.left+1&&a.top<b.bottom-1&&a.bottom>b.top+1;const targets=[...d.querySelectorAll('[data-action],#breathe,#sound,#pause,#hold,#choose-level')].map(e=>({name:e.getAttribute('aria-label')||e.textContent.trim(),width:Math.round(e.getBoundingClientRect().width),height:Math.round(e.getBoundingClientRect().height)}));output.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth+1,board:[Math.round(board.width),Math.round(board.height)],controlsBottom:Math.round(Math.max(pad.bottom,system.bottom,action.bottom)),controlsInView:Math.max(pad.bottom,system.bottom,action.bottom)<=w.innerHeight,centerOffset:Math.abs(board.x+board.width/2-pad.x-pad.width/2),padBelowBoard:pad.top>=board.bottom,controlsOverlap:hit(pad,system)||hit(pad,action)||hit(system,action),sidebarOverlap:hit(pieces,mission),targets},null,2);}
frame.onload=()=>requestAnimationFrame(()=>requestAnimationFrame(measure));
for(const button of document.querySelectorAll('[data-size]'))button.onclick=()=>{const [width,height]=button.dataset.size.split(',');frame.width=width;frame.height=height;output.textContent='크기 변경 중';requestAnimationFrame(()=>requestAnimationFrame(measure));};
</script></html>
